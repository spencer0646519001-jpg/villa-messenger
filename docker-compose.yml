name: villa-messenger

services:
  web:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "30", "--log-level", "debug"]
    build: .
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/homestay.db
    ports:
      - "${VILLA_PORT:-8002}:8000"
    volumes:
      - villa_sqlite:/data
      - ./secrets:/app/secrets:ro
    restart: unless-stopped

volumes:
  villa_sqlite:
    name: villa_sqlite
